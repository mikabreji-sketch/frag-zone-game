<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Dodge — FRAG//ZONE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b13;color:#f5f7ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:18px}
main{width:min(760px,100%)}a{color:#8af5a7;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:.35em 0}canvas{width:100%;background:#101729;border:1px solid #283653;border-radius:16px;display:block;touch-action:none}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.pill,button{border:1px solid #30415e;background:#141d30;color:#fff;border-radius:999px;padding:10px 15px;font:inherit}button{cursor:pointer;background:#9cf7b1;color:#06110a;font-weight:800}.hint{color:#aab6cc;font-size:.92rem}
</style></head><body><main><div class="top"><a href="../index.html">← Volver a FRAG//ZONE</a><span class="pill">ARCADE</span></div><h1>NEON DODGE</h1><p class="hint">Esquiva los bloques y sobrevive todo lo que puedas. Usa ← → o A/D; en móvil, arrastra el dedo.</p>
<div class="bar"><span class="pill">Puntos: <b id="score">0</b></span><span class="pill">Récord: <b id="best">0</b></span><button id="start">Jugar / reiniciar</button></div>
<canvas id="c" width="720" height="440" aria-label="Juego Neon Dodge"></canvas><p class="hint" id="msg">Pulsa «Jugar» para empezar.</p></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),msg=document.querySelector('#msg');
let p={x:340,y:380,w:38,h:20},blocks=[],score=0,running=false,frame=0,keys={},best=+(localStorage.neonDodgeBest||0);bestEl.textContent=best;
function reset(){p.x=341;blocks=[];score=0;frame=0;running=true;msg.textContent='¡A esquivar!';requestAnimationFrame(loop)}
document.querySelector('#start').onclick=reset;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
let dragging=false;c.addEventListener('pointerdown',e=>{dragging=true;c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(dragging)move(e)});c.addEventListener('pointerup',()=>dragging=false);
function move(e){let r=c.getBoundingClientRect();p.x=(e.clientX-r.left)/r.width*c.width-p.w/2}
function loop(){if(!running)return;frame++;if(frame%Math.max(13,34-Math.floor(score/8))===0)blocks.push({x:Math.random()*670,y:-22,w:22+Math.random()*38,h:18+Math.random()*24,s:2.4+Math.random()*2+score*.025});
if(keys.arrowleft||keys.a)p.x-=6;if(keys.arrowright||keys.d)p.x+=6;p.x=Math.max(0,Math.min(c.width-p.w,p.x));
x.clearRect(0,0,c.width,c.height);x.strokeStyle='#1d2b46';for(let i=0;i<12;i++){x.beginPath();x.moveTo(i*65,0);x.lineTo(i*65,440);x.stroke()}
x.fillStyle='#8cf5ac';x.shadowColor='#8cf5ac';x.shadowBlur=18;x.fillRect(p.x,p.y,p.w,p.h);x.shadowBlur=0;
for(let b of blocks){b.y+=b.s;x.fillStyle='#ff5c8a';x.fillRect(b.x,b.y,b.w,b.h);if(p.x<b.x+b.w&&p.x+p.w>b.x&&p.y<b.y+b.h&&p.y+p.h>b.y){running=false;msg.textContent='Fin de la partida. Pulsa Jugar para intentarlo otra vez.'}}
blocks=blocks.filter(b=>b.y<460);score=Math.floor(frame/6);scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.neonDodgeBest=best}
if(running)requestAnimationFrame(loop)}
function idle(){x.fillStyle='#101729';x.fillRect(0,0,720,440);x.fillStyle='#8cf5ac';x.font='bold 30px system-ui';x.fillText('NEON DODGE',245,205);x.fillStyle='#aab6cc';x.font='16px system-ui';x.fillText('Pulsa Jugar para comenzar',250,240)}idle();
</script></body></html>
