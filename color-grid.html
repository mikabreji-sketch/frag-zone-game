<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Grid — FRAG//ZONE</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b13;color:#f5f7ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(560px,100%)}a{color:#8af5a7;text-decoration:none}.top{display:flex;justify-content:space-between}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.tile{aspect-ratio:1;border:1px solid #34415c;border-radius:14px;background:#19243a;color:white;font-size:clamp(22px,7vw,40px);cursor:pointer}.tile.on{background:#a0f5b5;color:#07120a;box-shadow:0 0 22px #66e58c66}.tile:disabled{cursor:default}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill,button{padding:10px 14px;border-radius:999px;border:1px solid #34415c;background:#151e31;color:white;font:inherit}button{background:#a0f5b5;color:#07120a;font-weight:800;cursor:pointer}.muted{color:#aab6cc}</style></head><body><main class="wrap"><div class="top"><a href="../index.html">← Volver a FRAG//ZONE</a><span class="pill">PUZLES</span></div><h1>COLOR GRID</h1><p class="muted">Encuentra y pulsa las casillas iluminadas antes de que termine el tiempo. Cada ronda añade una casilla.</p><div class="bar"><span class="pill">Ronda: <b id="round">0</b></span><span class="pill">Tiempo: <b id="time">30</b>s</span><button id="go">Empezar</button></div><div class="board" id="board"></div><p id="msg" class="muted">Pulsa Empezar para jugar.</p></main>
<script>
const board=document.querySelector('#board'),roundEl=document.querySelector('#round'),timeEl=document.querySelector('#time'),msg=document.querySelector('#msg');let active=[],round=0,time=30,playing=false,timer=null;
for(let i=0;i<16;i++){let b=document.createElement('button');b.className='tile';b.textContent='+';b.onclick=()=>hit(i,b);board.appendChild(b)}
function start(){clearInterval(timer);round=0;time=30;playing=true;msg.textContent='¡Encuentra todas las casillas verdes!';next();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0){playing=false;clearInterval(timer);msg.textContent='Tiempo terminado. Llegaste a la ronda '+round+'. Pulsa Empezar para otra partida.'}},1000)}
function next(){round++;roundEl.textContent=round;active=[];let count=Math.min(1+Math.floor((round-1)/2),8);while(active.length<count){let n=Math.floor(Math.random()*16);if(!active.includes(n))active.push(n)}[...board.children].forEach((b,i)=>{b.classList.toggle('on',active.includes(i));b.textContent=active.includes(i)?'✦':'+'})}
function hit(i,b){if(!playing)return;if(active.includes(i)){active=active.filter(n=>n!==i);b.classList.remove('on');b.textContent='✓';if(!active.length){msg.textContent='¡Bien! Siguiente ronda…';setTimeout(()=>{if(playing)next()},350)}}else{time=Math.max(0,time-2);timeEl.textContent=time;b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],150)}}
document.querySelector('#go').onclick=start;
</script></body></html>
